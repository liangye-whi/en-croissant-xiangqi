<svg width="18" height="20" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect x="0" y="0" width="18" height="20" fill="#f9e4b7" stroke="black" stroke-width="0.05" />

  <!-- 横线 -->
  <g stroke="black" stroke-width="0.05">
    <!-- 10条横线 -->
    <line x1="1" y1="1" x2="17" y2="1" />
    <line x1="1" y1="3" x2="17" y2="3" />
    <line x1="1" y1="5" x2="17" y2="5" />
    <line x1="1" y1="7" x2="17" y2="7" />
    <line x1="1" y1="9" x2="17" y2="9" />
    <line x1="1" y1="11" x2="17" y2="11" />
    <line x1="1" y1="13" x2="17" y2="13" />
    <line x1="1" y1="15" x2="17" y2="15" />
    <line x1="1" y1="17" x2="17" y2="17" />
    <line x1="1" y1="19" x2="17" y2="19" />
  </g>

  <!-- 竖线 -->
  <g stroke="black" stroke-width="0.05">
    <!-- 9列：中间一条分为上下 -->
    <line x1="1" y1="1" x2="1" y2="19" />
    <line x1="3" y1="1" x2="3" y2="9" />
    <line x1="3" y1="11" x2="3" y2="19" />
    <line x1="5" y1="1" x2="5" y2="9" />
    <line x1="5" y1="11" x2="5" y2="19" />
    <line x1="7" y1="1" x2="7" y2="9" />
    <line x1="7" y1="11" x2="7" y2="19" />
    <line x1="9" y1="1" x2="9" y2="9" />
    <line x1="9" y1="11" x2="9" y2="19" />
    <line x1="11" y1="1" x2="11" y2="9" />
    <line x1="11" y1="11" x2="11" y2="19" />
    <line x1="13" y1="1" x2="13" y2="9" />
    <line x1="13" y1="11" x2="13" y2="19" />
    <line x1="15" y1="1" x2="15" y2="9" />
    <line x1="15" y1="11" x2="15" y2="19" />
    <line x1="17" y1="1" x2="17" y2="19" />
  </g>

  <!-- 楚河汉界 -->
  <!--<text x="120" y="260" font-size="24" fill="black">楚 河     汉 界</text>-->

  <!-- 将/帅九宫格对角线 -->
  <g stroke="black" stroke-width="0.05">
    <!-- 上九宫格 -->
    <line x1="7" y1="1" x2="11" y2="5" />
    <line x1="11" y1="1" x2="7" y2="5" />
    <!-- 下九宫格 -->
    <line x1="7" y1="15" x2="11" y2="19" />
    <line x1="11" y1="15" x2="7" y2="19" />
  </g>
</svg>

